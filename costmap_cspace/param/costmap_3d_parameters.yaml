costmap_3d:
  ang_resolution:
    type: int
    default_value: 16
  footprint:
    type: string
  overlay_mode:
    type: string
    default_value: max
    validation:
      one_of<>: [[max, overwrite]]
  static_layers:
    type: string_array
    default_value: []
    validation:
      unique<>: null
  layers:
    type: string_array
    validation:
      unique<>: null
  __map_static_layers: &layer
    overlay_mode:
      type: string
      default_value: max
      validation:
        one_of<>: [[max, overwrite]]
    type:
      type: string
      validation:
        one_of<>: [[Costmap3dLayerFootprint, Costmap3dLayerPlain, Costmap3dLayerStopPropagation, Costmap3dLayerUnknownHandle]]
    footprint:
      type: string
      default_value: ""
  __map_layers: *layer