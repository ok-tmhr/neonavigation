costmap_3d:
  ang_resolution:
    type: int
    default_value: 16
  footprint:
    type: string
  linear_expand:
    type: double
    default_value: 0.2
  linear_spread:
    type: double
    default_value: 0.5
  linear_spread_min_cost:
    type: int
    default_value: 0
  static_layers:
    type: string_array
    default_value: []
    validation:
      subset<>: [[]]
  __map_static_layers:
    overlay_mode:
      type: string
      default_value: max
      validation:
        one_of<>: [max]
    type:
      type: string
      validation:
        one_of<>: []
    footprint:
      type: string
      default_value: ""
  layers:
    type: string_array
    validation:
      subset<>: []
  __map_layers:
    overlay_mode: