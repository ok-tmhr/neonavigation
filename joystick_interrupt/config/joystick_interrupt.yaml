joystick_interrupt:
  ros__parameters:
    axis_bindings:
      - angular_velocity
      - linear_velocity_x
    button_bindings:
      - speed_up
      - speed_down
      - deadman
      - unassigned
      - unassigned
      - mode
    axis:
      angular_velocity:
        max: 0.8
        increment: 0.1
      linear_velocity_x:
        max: 0.5
        increment: 0.3
      linear_velocity_y:
        max: 0.0
        increment: 0.0
    speed_levels: 3
    timeout: 0.5

joystick_mux:
  ros__parameters:
    mux_input:
      topics: [mux_input0, mux_input1]
      type: std_msgs/msg/String
    timeout: 0.5
    button: 5